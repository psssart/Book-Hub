services:
  sql:
    image: postgres:16.4
    container_name: bookhub-sql
    env_file: [.env]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bookhub
    volumes:
      - sql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    init: true
    networks: [ bookhub-net ]

  migrator:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    working_dir: /app
    volumes:
      - ./artifacts:/app:ro
    env_file: [.env]
    depends_on:
      sql:
        condition: service_healthy
    entrypoint: ["/app/efbundle"]
    restart: "no"
    init: true
    networks: [ bookhub-net ]

  app:
    image: ghcr.io/psssart/book-hub-app:${APP_IMAGE_TAG}
    env_file: [ .env ]
    depends_on:
      sql:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    init: true
    networks: [ bookhub-net ]

volumes:
  sql-data:

networks:
  bookhub-net:
    