services:
  sql:
    image: postgres:16
    container_name: bookhub-sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bookhub
    volumes:
      - sql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookhub-app
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_KEY: ${JWT_KEY}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      sql:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  migrator:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /src
    volumes:
      - ./:/src
      - nuget_cache:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      NUGET_PACKAGES: /root/.nuget/packages
    depends_on:
      sql:
        condition: service_healthy
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        dotnet tool install dotnet-ef --tool-path /usr/local/bin --version 8.*
        dotnet restore
        dotnet build App.DAL.EF/App.DAL.EF.csproj -c Release
        dotnet build WebApp/WebApp.csproj -c Release
        dotnet-ef database update \
          --project App.DAL.EF/App.DAL.EF.csproj \
          --startup-project WebApp/WebApp.csproj
    restart: "no"

volumes:
  sql-data:
  nuget_cache:
