services:
  sql:
    image: postgres:16
    container_name: bookhub-sql
    ports:
      # external: internal
      - 7890:5432
    volumes:
      - sql-volume:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    restart: on-failure
    logging:
      options:
        max-size: 10m
        max-file: 3
  
  app:
    build: ./
    container_name: bookhub-app
    ports:
      - 8080:8080
    restart: on-failure
    logging:
      options:
        max-size: 10m
        max-file: 3
    environment:
      ConnectionStrings__DefaultConnection: "Host=bookhub-sql;Port=5432;Database=bookhub;Username=postgres;Password=postgres"
      Smtp__Password: 'APP_PSW'
    depends_on:
      - sql

volumes:
  sql-volume: