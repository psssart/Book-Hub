version: '3.9'

services:
  sql:
    image: postgres:16
    container_name: bookhub-sql-dev
    ports:
      - "7890:5432"
    volumes:
      - sql-volume:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookhub
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bookhub-app-dev
    ports:
      - "8080:8080"
    volumes:
      # Mount all project folders for live code updates
      - ./WebApp:/src/WebApp:delegated
      - ./App.BLL:/src/App.BLL:delegated
      - ./App.BLL.DTO:/src/App.BLL.DTO:delegated
      - ./App.Contracts.BLL:/src/App.Contracts.BLL:delegated
      - ./App.Contracts.DAL:/src/App.Contracts.DAL:delegated
      - ./App.DAL.DTO:/src/App.DAL.DTO:delegated
      - ./App.DAL.EF:/src/App.DAL.EF:delegated
      - ./App.DTO:/src/App.DTO:delegated
      - ./App.Domain:/src/App.Domain:delegated
      - ./Base.BLL:/src/Base.BLL:delegated
      - ./Base.Contracts.BLL:/src/Base.Contracts.BLL:delegated
      - ./Base.Contracts.DAL:/src/Base.Contracts.DAL:delegated
      - ./Base.Contracts.Domain:/src/Base.Contracts.Domain:delegated
      - ./Base.DAL.EF:/src/Base.DAL.EF:delegated
      - ./Base.Domain:/src/Base.Domain:delegated
      - ./Helpers:/src/Helpers:delegated
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=bookhub-sql-dev;Port=5432;Database=bookhub;Username=postgres;Password=postgres"
    depends_on:
      sql:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  sql-volume:
    name: bookhub-sql-data-dev