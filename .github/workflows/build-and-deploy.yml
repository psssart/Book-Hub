name: Build and Deploy

on:
  push:
    branches: [ main ]  # auto deploy on main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/book-hub-app
      APP_DIR: /home/deploy/apps/BookHub/BookHub  # compose + artifacts here

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: BookHub
        run: dotnet restore WebApp/WebApp.csproj -r linux-x64 -p:PublishReadyToRun=true
        # restore once

      - name: Build
        working-directory: BookHub
        run: dotnet build WebApp/WebApp.csproj -c Release --no-restore -v m
        # compile app

      - name: Build EF bundle
        working-directory: BookHub
        run: |
          export PATH="$PATH:/home/runner/.dotnet/tools"
          dotnet tool install --global dotnet-ef --version 8.*
          mkdir -p artifacts
          dotnet ef migrations bundle \
            --project App.DAL.EF/App.DAL.EF.csproj \
            --startup-project WebApp/WebApp.csproj \
            --configuration Release \
            --force \
            -o ./artifacts/efbundle
          chmod +x ./artifacts/efbundle
          (cd artifacts && sha256sum efbundle | awk '{print $1}' > efbundle.sha256)
        # checksum for conditional migrations

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        # enable buildx

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        # push with GITHUB_TOKEN

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
        # tag image with commit sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: BookHub
          file: BookHub/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        # build app image only

      - name: Prepare SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
        # ssh materials ready

      - name: Init remote dirs
        run: ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ${{ env.APP_DIR }}/artifacts"
        # ensure target path exists

      - name: Push efbundle to server
        run: |
          rsync -e "ssh -p ${{ secrets.SSH_PORT }}" -avz BookHub/artifacts/efbundle \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.APP_DIR }}/artifacts/efbundle.new
          rsync -e "ssh -p ${{ secrets.SSH_PORT }}" -avz BookHub/artifacts/efbundle.sha256 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.APP_DIR }}/artifacts/efbundle.sha256.new
        # stage bundle + checksum

      - name: Deploy over SSH
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF
          set -euo pipefail
          set -x  # verbose for debugging
          cd ${{ env.APP_DIR }}
          
          # ensure .env and set image tag
          grep -q '^APP_IMAGE_TAG=' .env || echo "APP_IMAGE_TAG=" >> .env
          sed -i "s/^APP_IMAGE_TAG=.*/APP_IMAGE_TAG=${IMAGE_TAG}/" .env
          
          # login to GHCR if token provided (private images)
          if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          fi
          
          # sanity: show services and current state
          docker compose -f docker-compose.prod.yml config --services || true
          docker compose -f docker-compose.prod.yml ps || true
          
          # pull image and start DB
          docker compose -f docker-compose.prod.yml pull app
          docker compose -f docker-compose.prod.yml up -d sql
          
          # run migrations only if bundle changed
          NEW_SHA="\$(cat artifacts/efbundle.sha256.new 2>/dev/null || true)"
          OLD_SHA="\$(cat artifacts/efbundle.sha256 2>/dev/null || true)"
          if [ -n "\$NEW_SHA" ] && [ "\$NEW_SHA" != "\$OLD_SHA" ]; then
            mv -f artifacts/efbundle.new artifacts/efbundle
            mv -f artifacts/efbundle.sha256.new artifacts/efbundle.sha256
            docker compose -f docker-compose.prod.yml run --rm migrator
          else
            rm -f artifacts/efbundle.new artifacts/efbundle.sha256.new || true
            echo "Skip migrations"
          fi
          
          # ALWAYS start/upgrade app
          docker compose -f docker-compose.prod.yml up -d app
          
          # show status and recent logs for app
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --no-color --tail=200 app || true
          EOF
